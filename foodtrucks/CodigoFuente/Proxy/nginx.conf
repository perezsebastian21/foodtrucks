worker_processes auto;
events {
}
http {
       log_format compression '$remote_addr - [$time_local] "$request" '
       '$status $body_bytes_sent "$http_referer" '
       '"$http_user_agent" "$http_x_forwarded_for" '
       '"$host" sn="$server_name" ' 'rt=$request_time '
       'ua="$upstream_addr" us="$upstream_status" '
       'ut="$upstream_response_time" ul="$upstream_response_length" '
       'cs="$upstream_cache_status" gzr="$gzip_ratio"  sh="$scheme-" ';

	upstream appupstream {
                server foodtrucks_app:3000;
        }

	upstream backendupstream {
                server foodtrucks_backend:80;

        }

        server {

                access_log /var/log/nginx/rta.log compression;

                listen 443 ssl;
                listen 3000;
                ssl_certificate     /etc/nginx/ssl/example.crt;
                ssl_certificate_key /etc/nginx/ssl/example.key;

		location / {
                        proxy_pass       http://appupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }

                location ~* ^/mosaico {
                        proxy_pass       http://appupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;

                }

                location ~* ^/adm {
                        proxy_pass       http://appupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }
 

                location ~* ^/user {
                        proxy_pass       http://appupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }

                location ~* ^/create {
                        proxy_pass       http://appupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }

                location ~* ^/edit {
                        proxy_pass       http://appupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }

		location ~* ^/foodtruck {
                        proxy_pass       http://backendupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }

		location ~* ^/categoria {
                        proxy_pass       http://backendupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }

		location ~* ^/account {
                        proxy_pass       http://backendupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }
		location ~* ^/usuario {
                        proxy_pass       http://backendupstream;
                        proxy_redirect   off;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $server_name;
                }
	}
}

